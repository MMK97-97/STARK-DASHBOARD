<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031426">
  <title>Events Live Board | Stark Premium</title>

  <style>
    :root {
      --navy-950: #031426;
      --navy-900: #061d35;
      --navy-850: #082746;
      --teal: #19d3c5;
      --text: #eff8ff;
      --muted: #9db3c7;
      --line: rgba(179, 214, 235, 0.15);
      --good: #39d98a;
      --amber: #ffc857;
      --danger: #ff6b78;
      --blue: #64a8ff;
      --purple: #c99bff;
      --shadow: 0 24px 70px rgba(0, 7, 17, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--navy-950);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 88% -15%, rgba(25, 211, 197, 0.2), transparent 35%),
        radial-gradient(circle at -5% 90%, rgba(70, 143, 210, 0.18), transparent 32%),
        linear-gradient(135deg, #031426, #071e35 50%, #082a45);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .tv-app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      padding: 16px clamp(16px, 1.5vw, 30px) 10px;
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr) 22px;
      gap: 12px;
    }

    .topbar {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 17px;
      color: white;
      font-size: 23px;
      font-weight: 950;
      background: linear-gradient(145deg, #0c3b65, #176d87);
      box-shadow:
        0 14px 34px rgba(0,8,18,0.32),
        inset 0 1px rgba(255,255,255,0.12);
    }

    .brand-eyebrow {
      margin: 0 0 3px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(20px, 1.5vw, 28px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .topbar-right {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .live-pill,
    .view-switch,
    .region-control,
    .clock-panel,
    .header-button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(5,25,44,0.7);
      backdrop-filter: blur(16px);
    }

    .live-pill {
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #dffdf9;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--good);
      box-shadow:
        0 0 0 6px rgba(57,217,138,0.12),
        0 0 18px rgba(57,217,138,0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.55;
        transform: scale(0.78);
      }
    }

    .view-switch {
      padding: 4px;
      display: flex;
      gap: 4px;
    }

    .view-button {
      min-width: 68px;
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 850;
    }

    .view-button.active {
      color: #021a2b;
      background: var(--teal);
    }

    .region-control {
      padding: 0 8px 0 13px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .region-control label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .region-control select {
      min-width: 62px;
      height: 36px;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-weight: 900;
    }

    .region-control option {
      color: var(--navy-900);
      background: white;
    }

    .clock-panel {
      min-width: 150px;
      padding: 6px 13px;
      display: grid;
      align-content: center;
      text-align: right;
    }

    .clock-time {
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
    }

    .header-button {
      width: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
    }

    .header-button:hover,
    .header-button:focus-visible {
      border-color: rgba(25,211,197,0.48);
      color: var(--teal);
      outline: none;
      background: rgba(25,211,197,0.1);
    }

    .header-button svg {
      width: 19px;
      height: 19px;
    }

    .content-grid {
      min-width: 0;
      min-height: 0;
      display: grid;
    }

    .spotlight {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: clamp(20px, 1.7vw, 32px);
      display: grid;
      grid-template-rows: auto auto minmax(140px, 1fr);
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        radial-gradient(circle at 100% 0%, rgba(25,211,197,0.14), transparent 32rem),
        linear-gradient(145deg, rgba(13,54,92,0.96), rgba(5,27,47,0.98));
      box-shadow:
        var(--shadow),
        inset 0 1px rgba(255,255,255,0.05);
      scrollbar-width: thin;
      scrollbar-color: rgba(25,211,197,0.45) transparent;
    }

    .spotlight::-webkit-scrollbar {
      width: 7px;
    }

    .spotlight::-webkit-scrollbar-track {
      background: transparent;
    }

    .spotlight::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: rgba(25,211,197,0.4);
    }

    .spotlight::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: -250px;
      right: -170px;
      width: 520px;
      height: 520px;
      border: 74px solid rgba(25,211,197,0.045);
      border-radius: 50%;
    }

    .top-information {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .event-kicker {
      margin: 0;
      color: var(--teal);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .badge,
    .priority-badge {
      min-height: 34px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge::before,
    .priority-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 13px currentColor;
    }

    .badge-good,
    .badge-complete,
    .badge-shipped,
    .priority-on-track,
    .priority-complete {
      border-color: rgba(57,217,138,0.25);
      color: var(--good);
      background: rgba(57,217,138,0.12);
    }

    .badge-low,
    .badge-cancelled,
    .priority-critical {
      border-color: rgba(255,107,120,0.28);
      color: var(--danger);
      background: rgba(255,107,120,0.13);
    }

    .badge-check,
    .badge-draft,
    .priority-urgent {
      border-color: rgba(255,200,87,0.27);
      color: var(--amber);
      background: rgba(255,200,87,0.13);
    }

    .badge-confirmed,
    .badge-ready-to-ship,
    .priority-attention {
      border-color: rgba(100,168,255,0.27);
      color: var(--blue);
      background: rgba(100,168,255,0.13);
    }

    .badge-allocating {
      border-color: rgba(201,155,255,0.27);
      color: var(--purple);
      background: rgba(201,155,255,0.13);
    }

    .primary-information {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      gap: 16px;
    }

    .po-card,
    .date-card,
    .planning-card,
    .items-panel {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(2,19,34,0.44);
      box-shadow: inset 0 1px rgba(255,255,255,0.035);
    }

    .po-card,
    .date-card,
    .planning-card {
      padding: 24px 30px;
      display: grid;
      align-content: center;
    }

    .po-card {
      min-height: 220px;
      background:
        linear-gradient(
          135deg,
          rgba(25,211,197,0.075),
          rgba(2,19,34,0.48)
        );
    }

    .date-card {
      min-height: 180px;
    }

    .planning-card {
      min-height: 180px;
    }

    .field-label {
      margin: 0 0 13px;
      color: var(--teal);
      font-size: clamp(14px, 1.1vw, 21px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .po-number {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: white;
      font-size: clamp(90px, 10vw, 180px);
      line-height: 0.88;
      font-weight: 950;
      letter-spacing: -0.065em;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    .customer {
      margin: 18px 0 0;
      overflow: hidden;
      color: #cde0ee;
      font-size: clamp(32px, 3vw, 58px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-value {
      margin: 0;
      overflow: hidden;
      color: white;
      font-size: clamp(65px, 7vw, 130px);
      line-height: 0.92;
      font-weight: 950;
      letter-spacing: -0.055em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-message {
      margin: 16px 0 0;
      color: var(--teal);
      font-size: clamp(18px, 1.6vw, 31px);
      font-weight: 900;
    }

    .date-message.risk {
      color: var(--danger);
    }

    .planning-value {
      margin: 0;
      overflow: visible;
      color: white;
      font-size: clamp(52px, 5vw, 95px);
      line-height: 1.05;
      font-weight: 950;
      letter-spacing: -0.045em;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .items-panel {
      min-height: 145px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .items-head {
      min-width: 0;
      min-height: 36px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.025);
    }

    .items-title {
      margin: 0;
      color: white;
      font-size: 11px;
      font-weight: 900;
    }

    .items-page {
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      white-space: nowrap;
    }

    .table-wrap {
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .items-table th,
    .items-table td {
      overflow: hidden;
      border-bottom: 1px solid rgba(179,214,235,0.09);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .items-table th {
      height: 23px;
      padding: 0 8px;
      color: #7f9ab1;
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: right;
      text-transform: uppercase;
    }

    .items-table td {
      height: 28px;
      padding: 0 8px;
      color: #e6f2fb;
      font-size: clamp(8px, 0.58vw, 11px);
      font-weight: 750;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .items-table th:first-child,
    .items-table td:first-child {
      width: 27%;
      padding-left: 13px;
      text-align: left;
    }

    .items-table th:last-child,
    .items-table td:last-child {
      width: 12%;
      padding-right: 13px;
    }

    .model-value {
      color: white !important;
      font-weight: 900 !important;
    }

    .balance-positive {
      color: var(--good) !important;
    }

    .balance-negative {
      color: var(--danger) !important;
    }

    .mini-status {
      min-width: 50px;
      padding: 3px 6px;
      display: inline-flex;
      justify-content: center;
      border-radius: 999px;
      font-size: 7px;
      font-weight: 950;
      letter-spacing: 0.05em;
    }

    .mini-status.good {
      color: var(--good);
      background: rgba(57,217,138,0.12);
    }

    .mini-status.low {
      color: var(--danger);
      background: rgba(255,107,120,0.13);
    }

    .mini-status.check {
      color: var(--amber);
      background: rgba(255,200,87,0.13);
    }

    .no-items {
      min-height: 100px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .empty-board {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 50px;
      border: 1px dashed rgba(133,191,221,0.3);
      border-radius: 28px;
      background: rgba(7,31,52,0.62);
      text-align: center;
    }

    .empty-title {
      margin: 0;
      font-size: clamp(28px, 3vw, 48px);
    }

    .empty-copy {
      max-width: 720px;
      margin: 14px auto 23px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .empty-link {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      border-radius: 13px;
      color: #032235;
      background: var(--teal);
      font-weight: 900;
      text-decoration: none;
    }

    .footer-bar {
      min-height: 22px;
      display: grid;
      grid-template-columns: auto minmax(140px, 1fr) auto;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
    }

    .rotation-track {
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(143,184,209,0.14);
    }

    .rotation-progress {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }

    .sync-copy {
      text-align: right;
    }

    .floating-controls {
      position: fixed;
      right: 26px;
      bottom: 25px;
      z-index: 20;
      padding: 6px;
      display: flex;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(3,19,33,0.86);
      box-shadow: 0 18px 44px rgba(0,0,0,0.34);
      backdrop-filter: blur(18px);
    }

    .control-button {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: white;
      background: rgba(9,38,63,0.92);
    }

    .control-button:hover,
    .control-button:focus-visible {
      border-color: rgba(25,211,197,0.55);
      outline: none;
      color: var(--teal);
      background: #10446e;
    }

    .control-button svg {
      width: 18px;
      height: 18px;
    }

    .floating-controls.paused {
      border-color: rgba(255,200,87,0.4);
    }

    .slide-enter {
      animation: slideEnter 0.42s ease both;
    }

    @keyframes slideEnter {
      from {
        opacity: 0;
        transform: translateY(9px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 1000px) {
      body {
        overflow: auto;
      }

      .tv-app {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto;
      }

      .clock-panel {
        display: none;
      }

      .spotlight {
        min-height: 850px;
      }
    }

    @media (max-width: 760px) {
      .tv-app {
        padding: 11px;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar-right {
        flex-wrap: wrap;
      }

      .live-pill,
      .region-control label {
        display: none;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .brand-title {
        font-size: 18px;
      }

      .spotlight {
        min-height: 0;
        padding: 17px;
        border-radius: 23px;
      }

      .top-information {
        align-items: flex-start;
        flex-direction: column;
      }

      .badges {
        justify-content: flex-start;
      }

      .po-card,
      .date-card,
      .planning-card {
        min-height: auto;
        padding: 22px;
      }

      .po-number {
        font-size: 64px;
      }

      .customer {
        font-size: 28px;
      }

      .date-value {
        font-size: 49px;
      }

      .date-message {
        font-size: 17px;
      }

      .planning-value {
        font-size: 39px;
      }

      .items-table {
        min-width: 700px;
      }

      .footer-bar {
        margin-bottom: 65px;
        grid-template-columns: 1fr;
      }

      .footer-bar > span {
        display: none;
      }

      .floating-controls {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="tv-app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">S</div>

        <div>
          <p class="brand-eyebrow">Stark Premium</p>
          <h1 class="brand-title">Events Live Board</h1>
        </div>
      </div>

      <div class="topbar-right">
        <div class="live-pill">
          <span class="live-dot"></span>
          Live
        </div>

        <div class="view-switch">
          <button id="activeViewButton" class="view-button" type="button">
            Active
          </button>

          <button id="allViewButton" class="view-button" type="button">
            All POs
          </button>
        </div>

        <div class="region-control">
          <label for="regionSelect">Region</label>

          <select id="regionSelect">
            <option value="US">US</option>
            <option value="EU">EU</option>
            <option value="CA">CA</option>
          </select>
        </div>

        <div class="clock-panel">
          <span id="clockTime" class="clock-time">--:--</span>
          <span id="clockDate" class="clock-date">Loading date</span>
        </div>

        <button
          id="fullscreenButton"
          class="header-button"
          type="button"
          title="Enter full screen"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="contentGrid" class="content-grid">
      <article id="spotlight" class="spotlight"></article>
    </section>

    <footer class="footer-bar">
      <span id="rotationCopy">
        Auto-rotating every 14 seconds
      </span>

      <div class="rotation-track">
        <div id="rotationProgress" class="rotation-progress"></div>
      </div>

      <span id="syncCopy" class="sync-copy">
        Waiting for regional data
      </span>
    </footer>
  </main>

  <div id="floatingControls" class="floating-controls">
    <button
      id="previousButton"
      class="control-button"
      type="button"
      title="Previous PO"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>

    <button
      id="pauseButton"
      class="control-button"
      type="button"
      title="Pause rotation"
    >
      <svg
        id="pauseIcon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
      >
        <path d="M8 5v14M16 5v14"/>
      </svg>
    </button>

    <button
      id="nextButton"
      class="control-button"
      type="button"
      title="Next PO"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </div>

  <script>
    (() => {
      "use strict";

      const REGIONS = ["US", "EU", "CA"];

      const REGION_NAMES = {
        US: "United States",
        EU: "European Union",
        CA: "Canada"
      };

      const LOCATIONS = ["Sarasota", "Texas"];
      const ITEMS_PER_SLIDE = 7;
      const ROTATION_MS = 14000;
      const REFRESH_MS = 5000;

      const params = new URLSearchParams(window.location.search);

      let region = (params.get("region") || "US").toUpperCase();

      if (!REGIONS.includes(region)) {
        region = "US";
      }

      let viewMode =
        (params.get("view") || "all").toLowerCase() === "active"
          ? "active"
          : "all";

      let events = [];
      let visibleEvents = [];
      let slides = [];
      let slideIndex = 0;
      let paused = false;
      let rotationStartedAt = Date.now();
      let lastFingerprint = "";

      let locationReports = {
        Sarasota: null,
        Texas: null
      };

      let locationMaps = {
        Sarasota: new Map(),
        Texas: new Map()
      };

      const spotlight = document.getElementById("spotlight");
      const contentGrid = document.getElementById("contentGrid");
      const regionSelect = document.getElementById("regionSelect");
      const activeViewButton = document.getElementById("activeViewButton");
      const allViewButton = document.getElementById("allViewButton");
      const pauseButton = document.getElementById("pauseButton");
      const pauseIcon = document.getElementById("pauseIcon");
      const floatingControls = document.getElementById("floatingControls");
      const rotationCopy = document.getElementById("rotationCopy");
      const rotationProgress = document.getElementById("rotationProgress");
      const syncCopy = document.getElementById("syncCopy");

      initialize();

      async function initialize() {
        regionSelect.value = region;

        configureViewButtons();
        bindControls();
        updateClock();

        window.setInterval(updateClock, 1000);

        await refreshData(true);

        window.setInterval(() => {
          refreshData(false);
        }, REFRESH_MS);

        window.requestAnimationFrame(updateRotation);
      }

      function bindControls() {
        regionSelect.addEventListener("change", () => {
          const nextUrl = new URL(window.location.href);

          nextUrl.searchParams.set("region", regionSelect.value);

          window.location.href = nextUrl.toString();
        });

        activeViewButton.addEventListener("click", () => {
          setViewMode("active");
        });

        allViewButton.addEventListener("click", () => {
          setViewMode("all");
        });

        document
          .getElementById("previousButton")
          .addEventListener("click", previousSlide);

        document
          .getElementById("nextButton")
          .addEventListener("click", nextSlide);

        pauseButton.addEventListener("click", togglePause);

        document
          .getElementById("fullscreenButton")
          .addEventListener("click", toggleFullscreen);

        window.addEventListener("storage", event => {
          if (event.key && event.key.startsWith("stark_events_v")) {
            refreshData(false);
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) {
            refreshData(false);
          }
        });

        document.addEventListener("keydown", event => {
          if (event.key === "ArrowRight") {
            nextSlide();
          }

          if (event.key === "ArrowLeft") {
            previousSlide();
          }

          if (event.key === " ") {
            event.preventDefault();
            togglePause();
          }

          if (event.key.toLowerCase() === "f") {
            toggleFullscreen();
          }
        });
      }

      function setViewMode(mode) {
        if (viewMode === mode) {
          return;
        }

        viewMode = mode;
        slideIndex = 0;

        const nextUrl = new URL(window.location.href);

        nextUrl.searchParams.set("view", mode);

        window.history.replaceState({}, "", nextUrl);

        configureViewButtons();
        buildSlides();
        renderCurrentSlide();
        resetRotation();
      }

      function configureViewButtons() {
        activeViewButton.classList.toggle(
          "active",
          viewMode === "active"
        );

        allViewButton.classList.toggle(
          "active",
          viewMode === "all"
        );
      }

      async function refreshData(forceRender) {
        const previousSlide = slides[slideIndex];
        const previousEventId = previousSlide?.event?.id || "";
        const previousPage = previousSlide?.itemPage || 0;

        const loadedEvents = normalizeEvents(
          loadExistingEvents()
        );

        locationReports = await loadStoredInventory();

        rebuildLocationMaps();

        events = loadedEvents
          .map(synchronizeEventInventory)
          .sort(compareEvents);

        const fingerprint = JSON.stringify({
          events: events.map(event => [
            event.id,
            event.updatedAt,
            event.status,
            event.items
          ]),
          inventory: LOCATIONS.map(location => [
            location,
            locationReports[location]?.uploadedAt || "",
            locationReports[location]?.rows?.length || 0
          ])
        });

        if (!forceRender && fingerprint === lastFingerprint) {
          return;
        }

        lastFingerprint = fingerprint;

        buildSlides();

        const retainedIndex = slides.findIndex(slide => {
          return (
            slide.event.id === previousEventId &&
            slide.itemPage === previousPage
          );
        });

        slideIndex =
          retainedIndex >= 0
            ? retainedIndex
            : Math.min(
                slideIndex,
                Math.max(0, slides.length - 1)
              );

        renderCurrentSlide();
        updateSyncCopy();
        resetRotation();
      }

      function loadExistingEvents() {
        const keys = [
          `stark_events_v6_${region}`,
          `stark_events_v5_${region}`,
          `stark_events_v4_${region}`
        ];

        for (const key of keys) {
          try {
            const storedValue = localStorage.getItem(key);

            const parsedValue = storedValue
              ? JSON.parse(storedValue)
              : null;

            if (Array.isArray(parsedValue)) {
              return parsedValue;
            }
          } catch (error) {
            console.warn(`Could not read ${key}.`, error);
          }
        }

        return [];
      }

      function normalizeEvents(records) {
        if (!Array.isArray(records)) {
          return [];
        }

        return records.map((event, index) => ({
          id: String(event.id || `event-${index}`),
          poNumber: String(event.poNumber || "Not entered"),
          customer: String(
            event.customer || "Customer not entered"
          ),
          inHandsDate: event.inHandsDate || "",
          status: event.status || "Draft",
          planning:
            event.planning ||
            event.fulfillmentPlanning ||
            "Planning not confirmed",
          createdAt: event.createdAt || "",
          updatedAt:
            event.updatedAt ||
            event.createdAt ||
            "",
          items: Array.isArray(event.items)
            ? event.items.map(item => ({
                model: String(item.model || ""),
                quantity: numberValue(item.quantity),
                sarasota:
                  numberValue(item.sarasota) ??
                  numberValue(item.stockSarasota),
                texas:
                  numberValue(item.texas) ??
                  numberValue(item.stockTexas),
                total:
                  numberValue(item.total) ??
                  numberValue(item.stock),
                matched: item.matched === true
              }))
            : []
        }));
      }

      function compareEvents(first, second) {
        const closedDifference =
          Number(isClosed(first)) -
          Number(isClosed(second));

        if (closedDifference !== 0) {
          return closedDifference;
        }

        const priorityDifference =
          eventPriorityScore(second) -
          eventPriorityScore(first);

        if (priorityDifference !== 0) {
          return priorityDifference;
        }

        return (
          dateValue(first.inHandsDate) -
          dateValue(second.inHandsDate)
        );
      }

      function buildSlides() {
        visibleEvents =
          viewMode === "active"
            ? events.filter(event => !isClosed(event))
            : [...events];

        slides = visibleEvents.flatMap(event => {
          const itemPages = Math.max(
            1,
            Math.ceil(event.items.length / ITEMS_PER_SLIDE)
          );

          return Array.from(
            { length: itemPages },
            (_, itemPage) => ({
              event,
              itemPage,
              itemPages
            })
          );
        });

        if (slideIndex >= slides.length) {
          slideIndex = 0;
        }
      }

      function openInventoryDatabase() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(
              new Error("Browser inventory storage unavailable.")
            );

            return;
          }

          const request = indexedDB.open(
            "StarkEventsInventoryDB",
            1
          );

          request.onupgradeneeded = () => {
            const database = request.result;

            if (
              !database.objectStoreNames.contains(
                "locationReports"
              )
            ) {
              database.createObjectStore(
                "locationReports",
                { keyPath: "key" }
              );
            }
          };

          request.onsuccess = () => {
            resolve(request.result);
          };

          request.onerror = () => {
            reject(request.error);
          };
        });
      }

      async function loadStoredInventory() {
        const result = {
          Sarasota: null,
          Texas: null
        };

        try {
          const database = await openInventoryDatabase();

          const reports = await new Promise(
            (resolve, reject) => {
              const transaction = database.transaction(
                "locationReports",
                "readonly"
              );

              const request = transaction
                .objectStore("locationReports")
                .getAll();

              request.onsuccess = () => {
                resolve(request.result || []);
              };

              request.onerror = () => {
                reject(request.error);
              };

              transaction.oncomplete = () => {
                database.close();
              };
            }
          );

          reports
            .filter(report => report.region === region)
            .forEach(report => {
              if (LOCATIONS.includes(report.location)) {
                result[report.location] = report;
              }
            });
        } catch (error) {
          console.warn(
            "Inventory reports could not be loaded.",
            error
          );
        }

        return result;
      }

      function rebuildLocationMaps() {
        LOCATIONS.forEach(location => {
          locationMaps[location] = createLocationMap(
            locationReports[location]
          );
        });
      }

      function createLocationMap(report) {
        const map = new Map();

        if (
          !report?.rows?.length ||
          !report.modelHeader
        ) {
          return map;
        }

        report.rows.forEach(row => {
          const model = normalizeModel(
            row[report.modelHeader]
          );

          const stock = extractStock(row, report);

          if (!model || stock === null) {
            return;
          }

          map.set(
            model,
            (map.get(model) || 0) + stock
          );
        });

        return map;
      }

      function extractStock(row, report) {
        if (report.directStockHeader) {
          return numberValue(
            row[report.directStockHeader]
          );
        }

        const onHand = report.onHandHeader
          ? numberValue(row[report.onHandHeader])
          : null;

        const ats = report.atsHeader
          ? numberValue(row[report.atsHeader])
          : null;

        if (onHand !== null && ats !== null) {
          return onHand + ats;
        }

        return onHand ?? ats;
      }

      function synchronizeEventInventory(event) {
        const inventoryAvailable = LOCATIONS.some(
          location => locationReports[location]
        );

        if (!inventoryAvailable) {
          return event;
        }

        return {
          ...event,
          items: event.items.map(item => {
            const model = normalizeModel(item.model);

            const sarasotaMatch =
              locationMaps.Sarasota.get(model);

            const texasMatch =
              locationMaps.Texas.get(model);

            const matched =
              sarasotaMatch !== undefined ||
              texasMatch !== undefined;

            const sarasota =
              sarasotaMatch !== undefined
                ? sarasotaMatch
                : null;

            const texas =
              texasMatch !== undefined
                ? texasMatch
                : null;

            return {
              ...item,
              sarasota,
              texas,
              total: matched
                ? (sarasota || 0) + (texas || 0)
                : null,
              matched
            };
          })
        };
      }

      function renderCurrentSlide() {
        document
          .getElementById("emptyBoard")
          ?.remove();

        if (!slides.length) {
          spotlight.classList.add("hidden");

          const emptyState =
            document.createElement("section");

          emptyState.id = "emptyBoard";

          emptyState.className =
            "empty-board slide-enter";

          emptyState.innerHTML = `
            <div>
              <h2 class="empty-title">
                No ${viewMode === "active" ? "active " : ""}events to display
              </h2>

              <p class="empty-copy">
                Open the ${escapeHtml(REGION_NAMES[region])}
                Events Control Center in this same browser,
                add or update a PO, and this screen will
                refresh automatically.
              </p>

              <a
                class="empty-link"
                href="events.html?region=${encodeURIComponent(region)}"
              >
                Open Events Control Center
              </a>
            </div>
          `;

          contentGrid.appendChild(emptyState);

          rotationCopy.textContent =
            "Waiting for events";

          return;
        }

        spotlight.classList.remove(
          "hidden",
          "slide-enter"
        );

        void spotlight.offsetWidth;

        spotlight.classList.add("slide-enter");

        const slide = slides[slideIndex];
        const event = slide.event;

        const inventoryStatus =
          getInventoryStatus(event);

        const priority =
          getEventPriority(event);

        const dateMessage =
          getDateMessage(event);

        const itemsStart =
          slide.itemPage * ITEMS_PER_SLIDE;

        const pageItems = event.items.slice(
          itemsStart,
          itemsStart + ITEMS_PER_SLIDE
        );

        spotlight.innerHTML = `
          <div class="top-information">
            <p class="event-kicker">
              ${escapeHtml(REGION_NAMES[region])}
              · Event ${getEventPosition(event)}
              of ${visibleEvents.length}
            </p>

            <div class="badges">
              <span class="priority-badge priority-${priority.slug}">
                ${escapeHtml(priority.label)}
              </span>

              <span class="badge badge-${statusSlug(event.status)}">
                ${escapeHtml(event.status)}
              </span>

              <span class="badge badge-${inventoryStatus.toLowerCase()}">
                Inventory ${inventoryStatus}
              </span>
            </div>
          </div>

          <div class="primary-information">
            <section class="po-card">
              <p class="field-label">PO</p>

              <h2
                class="po-number"
                title="${escapeHtml(event.poNumber)}"
              >
                ${escapeHtml(event.poNumber)}
              </h2>

              <p
                class="customer"
                title="${escapeHtml(event.customer)}"
              >
                ${escapeHtml(event.customer)}
              </p>
            </section>

            <section class="date-card">
              <p class="field-label">
                In-hands date
              </p>

              <p class="date-value">
                ${formatDate(event.inHandsDate)}
              </p>

              <p class="date-message ${isAtRisk(event) ? "risk" : ""}">
                ${escapeHtml(dateMessage)}
              </p>
            </section>

            <section class="planning-card">
              <p class="field-label">
                Planning
              </p>

              <p class="planning-value">
                ${escapeHtml(
                  event.planning ||
                  "Planning not confirmed"
                )}
              </p>
            </section>
          </div>

          <section class="items-panel">
            <div class="items-head">
              <h3 class="items-title">
                PO Line Items
              </h3>

              <span class="items-page">
                ${
                  event.items.length
                    ? `Items ${itemsStart + 1}–${Math.min(
                        itemsStart + pageItems.length,
                        event.items.length
                      )} of ${event.items.length}`
                    : "No items"
                }
                ${
                  slide.itemPages > 1
                    ? ` · Page ${slide.itemPage + 1} of ${slide.itemPages}`
                    : ""
                }
              </span>
            </div>

            ${renderItemsTable(pageItems)}
          </section>
        `;

        rotationCopy.textContent =
          slides.length > 1
            ? `${
                paused
                  ? "Rotation paused"
                  : "Auto-rotating every 14 seconds"
              } · Slide ${slideIndex + 1} of ${slides.length}`
            : "Single event view";
      }

      function renderItemsTable(items) {
        if (!items.length) {
          return `
            <div class="no-items">
              No model numbers have been added to this PO.
            </div>
          `;
        }

        return `
          <div class="table-wrap">
            <table class="items-table">
              <thead>
                <tr>
                  <th>Model#</th>
                  <th>PO Qty</th>
                  <th>Sarasota</th>
                  <th>Texas</th>
                  <th>Total</th>
                  <th>Balance</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                ${items.map(item => {
                  const quantity =
                    numberValue(item.quantity);

                  const total =
                    numberValue(item.total);

                  const status =
                    getItemInventoryStatus(item);

                  const balance =
                    quantity !== null &&
                    total !== null
                      ? total - quantity
                      : null;

                  return `
                    <tr>
                      <td
                        class="model-value"
                        title="${escapeHtml(
                          item.model || "Not entered"
                        )}"
                      >
                        ${escapeHtml(
                          item.model || "Not entered"
                        )}
                      </td>

                      <td>
                        ${numberOrDash(quantity)}
                      </td>

                      <td>
                        ${numberOrDash(item.sarasota)}
                      </td>

                      <td>
                        ${numberOrDash(item.texas)}
                      </td>

                      <td>
                        ${numberOrDash(total)}
                      </td>

                      <td class="${
                        balance === null
                          ? ""
                          : balance < 0
                            ? "balance-negative"
                            : "balance-positive"
                      }">
                        ${numberOrDash(balance)}
                      </td>

                      <td>
                        <span class="mini-status ${status.toLowerCase()}">
                          ${status}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function getEventPosition(event) {
        const position = visibleEvents.findIndex(
          record => record.id === event.id
        );

        return position >= 0
          ? position + 1
          : 1;
      }

      function nextSlide() {
        if (!slides.length) {
          return;
        }

        slideIndex =
          (slideIndex + 1) % slides.length;

        renderCurrentSlide();
        resetRotation();
      }

      function previousSlide() {
        if (!slides.length) {
          return;
        }

        slideIndex =
          (slideIndex - 1 + slides.length) %
          slides.length;

        renderCurrentSlide();
        resetRotation();
      }

      function togglePause() {
        paused = !paused;

        floatingControls.classList.toggle(
          "paused",
          paused
        );

        pauseButton.title = paused
          ? "Resume rotation"
          : "Pause rotation";

        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7z"/>'
          : '<path d="M8 5v14M16 5v14"/>';

        renderCurrentSlide();
        resetRotation();
      }

      function resetRotation() {
        rotationStartedAt = Date.now();
        rotationProgress.style.width = "0%";
      }

      function updateRotation() {
        if (!paused && slides.length > 1) {
          const elapsed =
            Date.now() - rotationStartedAt;

          const percentage = Math.min(
            100,
            (elapsed / ROTATION_MS) * 100
          );

          rotationProgress.style.width =
            `${percentage}%`;

          if (elapsed >= ROTATION_MS) {
            nextSlide();
          }
        } else {
          rotationProgress.style.width = "0%";
        }

        window.requestAnimationFrame(
          updateRotation
        );
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement
              .requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          console.warn(
            "Full screen is unavailable.",
            error
          );
        }
      }

      function updateClock() {
        const now = new Date();

        document.getElementById(
          "clockTime"
        ).textContent =
          new Intl.DateTimeFormat(
            undefined,
            {
              hour: "numeric",
              minute: "2-digit",
              second: "2-digit"
            }
          ).format(now);

        document.getElementById(
          "clockDate"
        ).textContent =
          new Intl.DateTimeFormat(
            undefined,
            {
              weekday: "short",
              month: "short",
              day: "numeric",
              year: "numeric"
            }
          ).format(now);
      }

      function updateSyncCopy() {
        const latestUpdate = [
          ...events.map(event => event.updatedAt),
          ...LOCATIONS.map(
            location =>
              locationReports[location]?.uploadedAt
          )
        ]
          .filter(Boolean)
          .sort()
          .pop();

        syncCopy.textContent = latestUpdate
          ? `Data refreshed · Latest update ${shortDateTime(latestUpdate)}`
          : `Waiting for ${REGION_NAMES[region]} data`;
      }

      function getEventShortage(event) {
        return event.items.reduce(
          (sum, item) => {
            const quantity =
              numberValue(item.quantity);

            const total =
              numberValue(item.total);

            if (
              quantity === null ||
              total === null ||
              item.matched !== true
            ) {
              return sum;
            }

            return sum + Math.max(
              0,
              quantity - total
            );
          },
          0
        );
      }

      function getEventPriority(event) {
        if (event.status === "Cancelled") {
          return {
            label: "Closed",
            slug: "complete",
            rank: 0
          };
        }

        if (event.status === "Complete") {
          return {
            label: "Complete",
            slug: "complete",
            rank: 0
          };
        }

        const days =
          daysUntil(event.inHandsDate);

        const inventoryStatus =
          getInventoryStatus(event);

        if (
          days !== null &&
          days < 0
        ) {
          return {
            label: "Critical",
            slug: "critical",
            rank: 4
          };
        }

        if (
          inventoryStatus === "LOW" &&
          (days === null || days <= 14)
        ) {
          return {
            label: "Critical",
            slug: "critical",
            rank: 4
          };
        }

        if (
          inventoryStatus === "LOW" ||
          (days !== null && days <= 7)
        ) {
          return {
            label: "Urgent",
            slug: "urgent",
            rank: 3
          };
        }

        if (
          inventoryStatus === "CHECK" ||
          days === null ||
          !event.planning ||
          event.planning ===
            "Planning not confirmed"
        ) {
          return {
            label: "Attention",
            slug: "attention",
            rank: 2
          };
        }

        return {
          label: "On track",
          slug: "on-track",
          rank: 1
        };
      }

      function eventPriorityScore(event) {
        const priority =
          getEventPriority(event);

        const days =
          daysUntil(event.inHandsDate);

        const urgency =
          days === null
            ? 0
            : Math.max(-60, 60 - days);

        return (
          priority.rank * 1000 +
          urgency +
          getEventShortage(event)
        );
      }

      function getInventoryStatus(event) {
        if (!event.items.length) {
          return "CHECK";
        }

        const statuses = event.items.map(
          getItemInventoryStatus
        );

        if (statuses.includes("LOW")) {
          return "LOW";
        }

        if (statuses.includes("CHECK")) {
          return "CHECK";
        }

        return "GOOD";
      }

      function getItemInventoryStatus(item) {
        const quantity =
          numberValue(item.quantity);

        const total =
          numberValue(item.total);

        if (
          quantity === null ||
          total === null ||
          item.matched !== true
        ) {
          return "CHECK";
        }

        return total >= quantity
          ? "GOOD"
          : "LOW";
      }

      function isClosed(event) {
        return (
          event.status === "Complete" ||
          event.status === "Cancelled"
        );
      }

      function isAtRisk(event) {
        if (isClosed(event)) {
          return false;
        }

        const days =
          daysUntil(event.inHandsDate);

        return (
          days !== null &&
          (
            days < 0 ||
            (
              days <= 7 &&
              event.status !== "Shipped"
            )
          )
        );
      }

      function getDateMessage(event) {
        const days =
          daysUntil(event.inHandsDate);

        if (days === null) {
          return "Date required";
        }

        if (isClosed(event)) {
          return event.status;
        }

        if (days < 0) {
          return `${Math.abs(days)} day${
            Math.abs(days) === 1
              ? ""
              : "s"
          } overdue`;
        }

        if (days === 0) {
          return "Due today";
        }

        return `${days} day${
          days === 1
            ? ""
            : "s"
        } remaining`;
      }

      function daysUntil(value) {
        const date = parseDate(value);

        if (!date) {
          return null;
        }

        const today = new Date();

        today.setHours(0, 0, 0, 0);

        return Math.ceil(
          (
            date.getTime() -
            today.getTime()
          ) / 86400000
        );
      }

      function parseDate(value) {
        if (!value) {
          return null;
        }

        const stringValue = String(value);

        const date =
          /^\d{4}-\d{2}-\d{2}$/.test(stringValue)
            ? new Date(
                `${stringValue}T00:00:00`
              )
            : new Date(stringValue);

        return Number.isNaN(date.getTime())
          ? null
          : date;
      }

      function dateValue(value) {
        return (
          parseDate(value)?.getTime() ||
          Number.MAX_SAFE_INTEGER
        );
      }

      function formatDate(value) {
        const date = parseDate(value);

        if (!date) {
          return "Not entered";
        }

        return new Intl.DateTimeFormat(
          "en-US",
          {
            month: "long",
            day: "numeric",
            year: "numeric"
          }
        ).format(date);
      }

      function shortDateTime(value) {
        const date = parseDate(value);

        if (!date) {
          return "Unknown";
        }

        return new Intl.DateTimeFormat(
          "en-US",
          {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
          }
        ).format(date);
      }

      function numberValue(value) {
        if (
          value === "" ||
          value === null ||
          value === undefined
        ) {
          return null;
        }

        if (typeof value === "number") {
          return Number.isFinite(value)
            ? value
            : null;
        }

        const cleaned = String(value)
          .replace(/,/g, "")
          .replace(/[^\d.-]/g, "");

        if (
          !cleaned ||
          cleaned === "-" ||
          cleaned === "."
        ) {
          return null;
        }

        const number = Number(cleaned);

        return Number.isFinite(number)
          ? number
          : null;
      }

      function formatNumber(value) {
        return new Intl.NumberFormat(
          "en-US",
          {
            maximumFractionDigits: 2
          }
        ).format(numberValue(value) || 0);
      }

      function numberOrDash(value) {
        const number = numberValue(value);

        return number === null
          ? "—"
          : formatNumber(number);
      }

      function normalizeModel(value) {
        return String(value || "")
          .trim()
          .toUpperCase()
          .replace(/\s+/g, "");
      }

      function statusSlug(value) {
        return String(value || "draft")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    })();
  </script>
</body>
