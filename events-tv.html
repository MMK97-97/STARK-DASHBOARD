<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04172a">
  <meta name="description" content="Premium live events operations board for Stark Premium.">
  <title>Events Operations Board | Stark Premium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --navy-1000: #020c17;
      --navy-950: #04172a;
      --navy-900: #06213a;
      --navy-850: #082b49;
      --navy-800: #103b61;
      --navy-700: #18547d;
      --teal: #2de1d1;
      --teal-2: #0db4aa;
      --white: #f8fcff;
      --text: #eaf5fc;
      --muted: #91a9bc;
      --line: rgba(167, 205, 229, .15);
      --green: #36d98b;
      --amber: #ffc75a;
      --red: #ff6378;
      --blue: #67a9ff;
      --shadow: 0 28px 80px rgba(0, 7, 16, .34);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    html { background: var(--navy-1000); }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at 88% -12%, rgba(45,225,209,.17), transparent 34%),
        radial-gradient(circle at -6% 96%, rgba(45,112,179,.2), transparent 34%),
        linear-gradient(135deg, #020e1b 0%, #061d35 50%, #082a45 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
    }

    button,
    select { font: inherit; }

    button { cursor: pointer; }

    .tv-app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100svh;
      min-height: 640px;
      display: grid;
      grid-template-rows: 72px minmax(0,1fr) 34px;
      gap: 14px;
      padding: 15px clamp(16px,2vw,36px) 12px;
    }

    .topbar,
    .topbar-actions,
    .brand,
    .clock-panel,
    .live-pill,
    .control-group,
    .board-footer,
    .metric,
    .event-main,
    .date-block {
      display: flex;
      align-items: center;
    }

    .topbar {
      justify-content: space-between;
      gap: 22px;
      min-width: 0;
    }

    .brand { gap: 14px; min-width: 0; }

    .brand-mark {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(145deg,#0c3b65,#13788b);
      box-shadow: 0 14px 32px rgba(0,8,18,.36), inset 0 1px rgba(255,255,255,.15);
      font: 800 1.4rem/1 "Manrope";
    }

    .brand-eyebrow,
    .section-eyebrow {
      margin: 0 0 3px;
      color: var(--teal);
      font-size: clamp(.66rem,.72vw,.78rem);
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      overflow: hidden;
      font: 800 clamp(1.15rem,1.45vw,1.65rem)/1.08 "Manrope";
      letter-spacing: -.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      justify-content: flex-end;
      gap: 9px;
      min-width: 0;
    }

    .glass-control {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(5,27,48,.72);
      box-shadow: inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(15px);
    }

    .live-pill {
      gap: 9px;
      padding: 0 14px;
      color: #ddfff9;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(54,217,139,.11), 0 0 18px rgba(54,217,139,.65);
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse { 50% { transform: scale(.75); opacity: .7; } }

    .region-control { padding: 0 8px 0 13px; }

    .region-control select {
      height: 44px;
      border: 0;
      outline: 0;
      color: var(--white);
      background: transparent;
      font-weight: 800;
    }

    .clock-panel {
      min-width: 154px;
      align-items: flex-end;
      flex-direction: column;
      justify-content: center;
      padding: 0 14px;
    }

    .clock-time { font: 800 .98rem/1 "Manrope"; }
    .clock-date { margin-top: 4px; color: var(--muted); font-size: .67rem; font-weight: 700; }

    .icon-button,
    .audio-button,
    .page-button,
    .pause-button {
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(5,27,48,.72);
      transition: transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }

    .icon-button:hover,
    .audio-button:hover,
    .page-button:hover,
    .pause-button:hover {
      transform: translateY(-1px);
      border-color: rgba(45,225,209,.4);
      background: rgba(14,58,91,.92);
    }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
    }

    .icon-button svg,
    .audio-button svg,
    .page-button svg,
    .pause-button svg { width: 18px; height: 18px; }

    .audio-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-radius: 14px;
      font-size: .74rem;
      font-weight: 800;
    }

    .audio-button.enabled {
      border-color: rgba(45,225,209,.45);
      color: var(--teal);
      background: rgba(45,225,209,.1);
    }

    .audio-button.speaking { color: #031426; background: var(--teal); }

    .events-board {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 52px minmax(0,1fr);
      border: 1px solid var(--line);
      border-radius: 23px;
      background: rgba(4,25,45,.8);
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.055);
      backdrop-filter: blur(18px);
    }

    .table-header,
    .event-row {
      display: grid;
      grid-template-columns: minmax(420px,2.25fr) minmax(220px,.75fr);
      align-items: center;
      column-gap: clamp(12px,1.3vw,24px);
      min-width: 0;
    }

    .table-header {
      padding: 0 clamp(18px,2vw,30px);
      border-bottom: 1px solid var(--line);
      color: #9db3c5;
      background: rgba(9,43,72,.72);
      font-size: clamp(.66rem,.7vw,.76rem);
      font-weight: 800;
      letter-spacing: .105em;
      text-transform: uppercase;
    }

    .event-list {
      min-height: 0;
      overflow: hidden;
      display: grid;
      align-content: stretch;
    }

    .event-row {
      position: relative;
      min-height: 0;
      padding: 10px clamp(18px,2vw,30px);
      border-bottom: 1px solid var(--line);
      background: rgba(6,32,55,.28);
      animation: row-in .42s cubic-bezier(.2,.8,.2,1) both;
    }

    .event-row:nth-child(even) { background: rgba(14,52,82,.24); }
    .event-row:last-child { border-bottom: 0; }

    .event-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 17%;
      bottom: 17%;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--row-color,var(--blue));
      box-shadow: 0 0 16px color-mix(in srgb,var(--row-color,var(--blue)) 56%,transparent);
    }

    .event-row.critical { --row-color: var(--red); }
    .event-row.warning { --row-color: var(--amber); }
    .event-row.good { --row-color: var(--green); }
    .event-row.neutral { --row-color: var(--blue); }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .po-number {
      color: var(--white);
      font: 800 clamp(1.16rem,1.45vw,1.62rem)/1.08 "Manrope";
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }

    .po-meta { margin-top: 5px; color: var(--muted); font-size: clamp(.64rem,.7vw,.75rem); font-weight: 700; }

    .event-info {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 9px;
    }

    .customer-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .customer-name {
      color: #dff3ff;
      font-size: clamp(.82rem,.95vw,1rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .customer-block {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: clamp(12px,1.15vw,22px);
    }

    .customer-block .customer-name {
      min-width: 0;
      flex: 1 1 auto;
    }

    .customer-block .po-type {
      flex: 0 0 auto;
    }

    .po-type {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(103,169,255,.22);
      border-radius: 999px;
      color: #cfe5ff;
      background: rgba(103,169,255,.09);
      font-size: clamp(.66rem,.72vw,.78rem);
      font-weight: 800;
      letter-spacing: .035em;
      white-space: nowrap;
    }

    .po-type.hold {
      border-color: rgba(255,199,90,.25);
      color: #ffe2a1;
      background: rgba(255,199,90,.09);
    }

    .po-type::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .date-block { align-items: flex-start; flex-direction: column; }
    .in-hands { color: var(--white); font: 800 clamp(.84rem,.98vw,1.04rem)/1.1 "Manrope"; }
    .date-status { margin-top: 6px; color: var(--muted); font-size: clamp(.63rem,.7vw,.75rem); font-weight: 700; }
    .event-row.critical .date-status { color: #ff93a1; }
    .event-row.warning .date-status { color: #ffd77e; }
    .event-row.good .date-status { color: #75e7ae; }

    .empty-state {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 7px; color: var(--white); font: 800 1.3rem "Manrope"; }

    .board-footer {
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: .69rem;
      font-weight: 700;
    }

    .progress-track {
      height: 4px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg,var(--teal-2),var(--teal));
      box-shadow: 0 0 14px rgba(45,225,209,.45);
    }

    .control-group { gap: 7px; }
    .page-button,
    .pause-button {
      width: 34px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
    }

    .page-dots { display: flex; align-items: center; gap: 5px; }
    .page-dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.18); transition: width .2s ease,background .2s ease; }
    .page-dot.active { width: 18px; background: var(--teal); }

    .greeting-overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      opacity: 0;
      visibility: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 50% 38%,rgba(45,225,209,.24),transparent 34%),
        rgba(2,13,25,.96);
      backdrop-filter: blur(22px);
      transition: opacity .45s ease,visibility .45s ease;
    }

    .greeting-overlay.active { opacity: 1; visibility: visible; }

    .greeting-card {
      width: min(1100px,92vw);
      padding: clamp(44px,6vw,86px);
      border: 1px solid rgba(45,225,209,.26);
      border-radius: 34px;
      background: linear-gradient(145deg,rgba(12,57,91,.87),rgba(5,29,51,.92));
      box-shadow: 0 40px 120px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.08);
      text-align: center;
    }

    .greeting-card h2 { margin: 8px 0 15px; font: 800 clamp(2.5rem,6vw,6rem)/.98 "Manrope"; letter-spacing: -.055em; }
    .greeting-card p { margin: 0; color: var(--teal); font: 700 clamp(1.2rem,2.4vw,2.4rem)/1.2 "Manrope"; }

    button:focus-visible,
    select:focus-visible { outline: 3px solid rgba(45,225,209,.35); outline-offset: 3px; }

    @media (max-width: 1050px) {
      .live-pill,
      .audio-button span,
      .clock-date { display: none; }
      .audio-button { width: 46px; padding: 0; justify-content: center; }
      .clock-panel { min-width: 105px; }
      .table-header,
      .event-row { grid-template-columns: minmax(330px,2fr) minmax(175px,.8fr); }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .tv-app { height: auto; min-height: 100svh; grid-template-rows: auto minmax(520px,1fr) auto; }
      .topbar { align-items: flex-start; }
      .topbar-actions { flex-wrap: wrap; }
      .events-board { overflow: auto; }
      .table-header { display: none; }
      .event-list { display: block; }
      .event-row {
        grid-template-columns: 1fr;
        gap: 12px;
        margin: 10px;
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .customer-block { flex-wrap: wrap; }
      .board-footer { padding: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>

<body>
  <main class="tv-app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <p class="brand-eyebrow">Stark Premium</p>
          <h1 class="brand-title">Events Operations Board</h1>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="glass-control live-pill"><span class="live-dot"></span>Live sync</div>

        <button id="audioButton" class="audio-button" type="button" title="Enable spoken alerts" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a8.5 8.5 0 0 1 0 12"></path></svg>
          <span id="audioText">Enable audio</span>
        </button>

        <label class="glass-control region-control">
          <select id="regionSelect" aria-label="Reporting region">
            <option value="US">US</option>
            <option value="EU">EU</option>
            <option value="CA">Canada</option>
          </select>
        </label>

        <div class="glass-control clock-panel">
          <span id="clockTime" class="clock-time">--:-- --</span>
          <span id="clockDate" class="clock-date">Loading date</span>
        </div>

        <button id="fullscreenButton" class="icon-button" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg>
        </button>
      </div>
    </header>

    <section class="events-board" aria-live="polite">
      <div class="table-header" aria-hidden="true">
        <span>PO# / Customer / PO type</span>
        <span>In-hands</span>
      </div>
      <div id="eventList" class="event-list"></div>
    </section>

    <footer class="board-footer">
      <span id="pageCopy">Waiting for event data</span>
      <div class="progress-track" aria-hidden="true"><div id="rotationProgress" class="progress-bar"></div></div>
      <div id="pageDots" class="page-dots" aria-hidden="true"></div>
      <div class="control-group">
        <button id="previousButton" class="page-button" type="button" title="Previous page" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button id="pauseButton" class="pause-button" type="button" title="Pause page rotation" aria-label="Pause page rotation"><svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 5v14M16 5v14"></path></svg></button>
        <button id="nextButton" class="page-button" type="button" title="Next page" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <span id="syncCopy">Auto-refreshing</span>
    </footer>
  </main>

  <section id="greetingOverlay" class="greeting-overlay" aria-hidden="true">
    <div class="greeting-card">
      <p class="section-eyebrow">Stark Premium team message</p>
      <h2 id="greetingPrimary"></h2>
      <p id="greetingSecondary"></p>
    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const VALID_REGIONS = ["US", "EU", "CA"];
      const REGION_NAMES = { US: "United States", EU: "European Union", CA: "Canada" };
      const ROTATION_MS = 60000;
      const REFRESH_MS = 5000;
      const GREETING_DURATION_MS = 14000;
      const SCHEDULED_GREETINGS = {
        "08:00": ["GOOD MORNING EVERYONE", "HAVE A NICE DAY"],
        "09:00": ["GOOD MORNING EVERYONE", "HAVE A NICE DAY"],
        "16:00": ["GOOD NIGHT EVERYONE", "SEE YOU TOMORROW"],
        "17:00": ["GOOD NIGHT EVERYONE", "SEE YOU TOMORROW"]
      };

      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      let region = (params.get("region") || "US").toUpperCase();
      if (!VALID_REGIONS.includes(region)) region = "US";

      let events = [];
      let pages = [];
      let pageIndex = 0;
      const rowsPerPage = 5;
      let paused = false;
      let rotationStartedAt = Date.now();
      let lastFingerprint = "";
      let audioEnabled = false;
      let selectedVoice = null;
      let lastAnnouncementKey = "";
      let greetingActive = false;
      let greetingTimer = null;
      let pausedBeforeGreeting = false;

      initialize();

      function initialize() {
        $("regionSelect").value = region;
        loadAudioPreference();
        loadVoices();
        bindControls();
        updateClockAndSchedule();
        refreshData(true);
        setInterval(() => refreshData(false), REFRESH_MS);
        setInterval(updateClockAndSchedule, 1000);
        requestAnimationFrame(updateRotation);
      }

      function bindControls() {
        $("regionSelect").addEventListener("change", event => {
          const next = new URL(location.href);
          next.searchParams.set("region", event.target.value);
          location.href = next.toString();
        });

        $("audioButton").addEventListener("click", toggleAudio);
        $("fullscreenButton").addEventListener("click", toggleFullscreen);
        $("previousButton").addEventListener("click", previousPage);
        $("nextButton").addEventListener("click", nextPage);
        $("pauseButton").addEventListener("click", togglePause);

        addEventListener("storage", event => {
          if (event.key && event.key.startsWith("stark_events_v")) refreshData(false);
        });

        addEventListener("keydown", event => {
          if (event.key === "ArrowRight") nextPage();
          if (event.key === "ArrowLeft") previousPage();
          if (event.key === " ") { event.preventDefault(); togglePause(); }
          if (event.key.toLowerCase() === "f") toggleFullscreen();
          if (event.key.toLowerCase() === "a") toggleAudio();
        });

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stopSpeaking();
          else refreshData(false);
        });

        if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", loadVoices);
      }

      function loadEvents() {
        const keys = [`stark_events_v6_${region}`, `stark_events_v5_${region}`, `stark_events_v4_${region}`];
        for (const key of keys) {
          try {
            const value = JSON.parse(localStorage.getItem(key) || "null");
            if (Array.isArray(value)) return value;
          } catch (error) { console.warn(`Unable to read ${key}.`, error); }
        }
        return [];
      }

      function normalizeEvents(records) {
        return records.map((event, index) => {
          const poNumber = String(event.poNumber || event.po || "Not entered");
          return {
            id: String(event.id || `event-${index}`),
            poNumber,
            customer: String(event.customer || "Customer not entered"),
            poType: String(event.poType || (/HOLD\s*PO/i.test(poNumber) ? "HOLD PO" : "FIRM PO")),
            inHandsDate: event.inHandsDate || event.inhandsDate || "",
            planning: String(event.planning || event.fulfillmentPlanning || "Planning not confirmed"),
            items: Array.isArray(event.items) ? event.items : [],
            updatedAt: event.updatedAt || event.createdAt || ""
          };
        }).sort(compareEvents);
      }

      function compareEvents(a, b) {
        const first = dateValue(a.inHandsDate);
        const second = dateValue(b.inHandsDate);
        if (first === null && second !== null) return 1;
        if (first !== null && second === null) return -1;
        if (first !== second) return (first ?? 0) - (second ?? 0);
        return a.poNumber.localeCompare(b.poNumber);
      }

      function refreshData(force) {
        const nextEvents = normalizeEvents(loadEvents());
        const fingerprint = JSON.stringify(nextEvents.map(event => [event.id,event.poNumber,event.customer,event.poType,event.inHandsDate,event.planning,event.items.length,event.updatedAt]));
        if (!force && fingerprint === lastFingerprint) return;
        lastFingerprint = fingerprint;
        events = nextEvents;
        buildPages();
        render();
        resetRotation();
      }

      function buildPages() {
        pages = [];
        for (let index = 0; index < events.length; index += rowsPerPage) pages.push(events.slice(index,index + rowsPerPage));
        if (pageIndex >= pages.length) pageIndex = Math.max(0,pages.length - 1);
      }

      function render() {
        if (!pages.length) {
          $("eventList").style.gridTemplateRows = "1fr";
          $("eventList").innerHTML = `<div class="empty-state"><div><strong>No saved events</strong><span>Add events on the Events page for ${escapeHtml(REGION_NAMES[region])}.</span></div></div>`;
          $("pageCopy").textContent = "No events available";
          $("pageDots").innerHTML = "";
          $("rotationProgress").style.width = "0%";
          return;
        }

        const currentPage = pages[pageIndex];
        $("eventList").style.gridTemplateRows = `repeat(${Math.max(1,currentPage.length)},minmax(0,1fr))`;
        $("eventList").innerHTML = currentPage.map((event,index) => renderEvent(event,index)).join("");
        $("pageCopy").textContent = pages.length > 1 ? `Events ${pageIndex * rowsPerPage + 1}–${Math.min((pageIndex + 1) * rowsPerPage,events.length)} of ${events.length}` : `${events.length} event${events.length === 1 ? "" : "s"}`;
        $("pageDots").innerHTML = pages.map((_,index) => `<span class="page-dot ${index === pageIndex ? "active" : ""}"></span>`).join("");
        maybeAnnouncePage();
      }

      function renderEvent(event,index) {
        const urgency = urgencyFor(event.inHandsDate);
        const typeClass = /hold/i.test(event.poType) ? "hold" : "firm";
        return `
          <article class="event-row ${urgency.className}" style="animation-delay:${index * 42}ms">
            <div class="event-info">
              <div class="event-main"><div><div class="po-number" title="${escapeHtml(event.poNumber)}">${escapeHtml(event.poNumber)}</div><div class="po-meta">${event.items.length} model${event.items.length === 1 ? "" : "s"}</div></div></div>
              <div class="customer-block"><div class="customer-name" title="${escapeHtml(event.customer)}">${escapeHtml(event.customer)}</div><span class="po-type ${typeClass}">${escapeHtml(event.poType)}</span></div>
            </div>
            <div class="date-block"><span class="in-hands">${escapeHtml(formatDate(event.inHandsDate))}</span><span class="date-status">${escapeHtml(urgency.label)}</span></div>
          </article>`;
      }

      function urgencyFor(value) {
        const days = daysUntil(value);
        if (days === null) return { className: "neutral", label: "Date not entered" };
        if (days < 0) return { className: "critical", label: `${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"} overdue` };
        if (days === 0) return { className: "critical", label: "Due today" };
        if (days <= 7) return { className: "warning", label: `${days} day${days === 1 ? "" : "s"} remaining` };
        return { className: "good", label: `${days} days remaining` };
      }

      function nextPage() {
        if (pages.length < 2) return;
        pageIndex = (pageIndex + 1) % pages.length;
        lastAnnouncementKey = "";
        render();
        resetRotation();
      }

      function previousPage() {
        if (pages.length < 2) return;
        pageIndex = (pageIndex - 1 + pages.length) % pages.length;
        lastAnnouncementKey = "";
        render();
        resetRotation();
      }

      function togglePause() {
        paused = !paused;
        $("pauseIcon").innerHTML = paused ? `<path d="m8 5 11 7-11 7V5Z"></path>` : `<path d="M8 5v14M16 5v14"></path>`;
        $("pauseButton").title = paused ? "Resume page rotation" : "Pause page rotation";
        if (!paused) resetRotation();
      }

      function resetRotation() {
        rotationStartedAt = Date.now();
        $("rotationProgress").style.width = "0%";
      }

      function updateRotation() {
        if (!paused && !greetingActive && pages.length > 1) {
          const elapsed = Date.now() - rotationStartedAt;
          $("rotationProgress").style.width = `${Math.min(100,elapsed / ROTATION_MS * 100)}%`;
          if (elapsed >= ROTATION_MS) nextPage();
        }
        requestAnimationFrame(updateRotation);
      }

      function loadAudioPreference() {
        audioEnabled = localStorage.getItem(`stark_events_tv_audio_${region}`) === "true" && "speechSynthesis" in window;
        if (!("speechSynthesis" in window)) $("audioButton").disabled = true;
        updateAudioButton();
      }

      function toggleAudio() {
        if (!("speechSynthesis" in window)) return;
        audioEnabled = !audioEnabled;
        localStorage.setItem(`stark_events_tv_audio_${region}`,String(audioEnabled));
        if (!audioEnabled) stopSpeaking();
        lastAnnouncementKey = "";
        updateAudioButton();
        if (audioEnabled && !greetingActive) maybeAnnouncePage();
      }

      function updateAudioButton(speaking = false) {
        $("audioButton").classList.toggle("enabled",audioEnabled);
        $("audioButton").classList.toggle("speaking",speaking);
        $("audioButton").setAttribute("aria-pressed",String(audioEnabled));
        $("audioText").textContent = speaking ? "Speaking" : audioEnabled ? "Audio on" : "Enable audio";
      }

      function loadVoices() {
        if (!("speechSynthesis" in window)) return;
        const voices = speechSynthesis.getVoices();
        selectedVoice = voices.find(voice => voice.lang === "en-US" && /Microsoft|Google|Samantha|Ava|Jenny/i.test(voice.name)) || voices.find(voice => voice.lang === "en-US") || voices.find(voice => voice.lang.startsWith("en")) || null;
      }

      function speak(message,{ rate=.8,pitch=1.03 }={}) {
        if (!audioEnabled || !("speechSynthesis" in window) || !message) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.lang = "en-US";
        utterance.rate = rate;
        utterance.pitch = pitch;
        utterance.volume = 1;
        utterance.onstart = () => updateAudioButton(true);
        utterance.onend = utterance.onerror = () => updateAudioButton(false);
        speechSynthesis.speak(utterance);
      }

      function stopSpeaking() {
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        updateAudioButton(false);
      }

      function maybeAnnouncePage() {
        if (!audioEnabled || greetingActive || !pages.length) return;
        const dueEvents = pages[pageIndex].filter(event => { const days = daysUntil(event.inHandsDate); return days !== null && days >= 0 && days <= 7; });
        if (!dueEvents.length) return;
        const key = `${pageIndex}:${dueEvents.map(event => event.id).join(",")}`;
        if (key === lastAnnouncementKey) return;
        lastAnnouncementKey = key;
        const message = dueEvents.map(event => {
          const days = daysUntil(event.inHandsDate);
          const po = event.poNumber.replace(/-/g," dash ").replace(/\//g," slash ");
          const timing = days === 0 ? "The in hands date is today." : days === 1 ? "The in hands date is tomorrow." : `There are ${days} days remaining.`;
          return `Purchase order ${po}. In hands date is ${formatSpokenDate(event.inHandsDate)}. ${timing}`;
        }).join(" Next. ");
        speak(`Attention. ${message}`,{ rate:.78,pitch:1.05 });
      }

      function updateClockAndSchedule() {
        const now = new Date();
        $("clockTime").textContent = now.toLocaleTimeString("en-US",{ hour:"numeric",minute:"2-digit",second:"2-digit" });
        $("clockDate").textContent = now.toLocaleDateString("en-US",{ weekday:"short",month:"short",day:"numeric" });
        const timeKey = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
        const greeting = SCHEDULED_GREETINGS[timeKey];
        if (!greeting || greetingActive) return;
        const dateKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
        const completionKey = `stark_tv_greeting_${dateKey}_${timeKey}`;
        if (localStorage.getItem(completionKey) === "true") return;
        localStorage.setItem(completionKey,"true");
        showGreeting(greeting[0],greeting[1]);
      }

      function showGreeting(primary,secondary) {
        clearTimeout(greetingTimer);
        greetingActive = true;
        pausedBeforeGreeting = paused;
        paused = true;
        stopSpeaking();
        $("greetingPrimary").textContent = primary;
        $("greetingSecondary").textContent = secondary;
        $("greetingOverlay").classList.add("active");
        $("greetingOverlay").setAttribute("aria-hidden","false");
        speak(`${primary}. ${secondary}.`,{ rate:.75,pitch:1.05 });
        greetingTimer = setTimeout(hideGreeting,GREETING_DURATION_MS);
      }

      function hideGreeting() {
        $("greetingOverlay").classList.remove("active");
        $("greetingOverlay").setAttribute("aria-hidden","true");
        greetingActive = false;
        paused = pausedBeforeGreeting;
        resetRotation();
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (error) { console.warn("Fullscreen is unavailable.",error); }
      }

      function parseDate(value) {
        if (!value) return null;
        if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
        const text = String(value).trim();
        const iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        const us = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        let date = null;
        if (iso) date = new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3]));
        else if (us) date = new Date(Number(us[3]),Number(us[1])-1,Number(us[2]));
        else date = new Date(text);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function daysUntil(value) {
        const target = parseDate(value);
        if (!target) return null;
        const today = new Date();
        today.setHours(0,0,0,0);
        target.setHours(0,0,0,0);
        return Math.round((target - today) / 86400000);
      }

      function dateValue(value) {
        const date = parseDate(value);
        return date ? date.getTime() : null;
      }

      function formatDate(value) {
        const date = parseDate(value);
        return date ? date.toLocaleDateString("en-US",{ month:"short",day:"numeric",year:"numeric" }) : "Not entered";
      }

      function formatSpokenDate(value) {
        const date = parseDate(value);
        return date ? date.toLocaleDateString("en-US",{ month:"long",day:"numeric",year:"numeric" }) : "not entered";
      }

      function formatNumber(value) { return Number(value || 0).toLocaleString("en-US"); }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g,character => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[character]);
      }
    })();
  </script>
</body>
</html>
