<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="description"
    content="Opening the regional inventory dashboard"
  >

  <title>
    Inventory Analysis | Stark Regional Inventory
  </title>

  <script>
    (function () {
      "use strict";

      const parameters =
        new URLSearchParams(
          window.location.search
        );

      const requestedRegion =
        parameters.get("region") ||
        "US";

      const region =
        requestedRegion === "EU" ||
        requestedRegion === "Canada"
          ? requestedRegion
          : "US";

      window.location.replace(
        `inventory-dashboard.html?region=${encodeURIComponent(region)}`
      );
    })();
  </script>
</head>

<body>
  <p>
    Opening Inventory Dashboard…

    <a id="dashboard-fallback" href="inventory-dashboard.html?region=US">
      Continue to Inventory Dashboard
    </a>
  </p>

  <script>
    (function () {
      const parameters =
        new URLSearchParams(
          window.location.search
        );

      const requestedRegion =
        parameters.get("region") ||
        "US";

      const region =
        requestedRegion === "EU" ||
        requestedRegion === "Canada"
          ? requestedRegion
          : "US";

      document
        .getElementById(
          "dashboard-fallback"
        )
        .href =
          `inventory-dashboard.html?region=${encodeURIComponent(region)}`;
    })();
  </script>
</body>
</html>
